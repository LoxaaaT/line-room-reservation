<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ภาพรวมห้อง · Room Reservation</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/config.js"></script>
  <script src="/common.js"></script>
</head>
<body>
<div class="wrap">
  <h1>ภาพรวมห้อง</h1>
  <div id="loader" class="loader">กำลังโหลด...</div>

  <div id="content" style="display:none">
    <div class="card">
      <div class="row" style="text-align:center">
        <div>
          <div class="muted">ห้องทั้งหมด</div>
          <div style="font-size:24px;font-weight:700" id="totalAll">-</div>
        </div>
        <div>
          <div class="muted">ว่างวันนี้</div>
          <div style="font-size:24px;font-weight:700;color:#1d8a31" id="totalFree">-</div>
        </div>
        <div>
          <div class="muted">มีคนพัก</div>
          <div style="font-size:24px;font-weight:700;color:#c92a2a" id="totalOcc">-</div>
        </div>
      </div>
    </div>

    <p class="muted" style="font-size:12px">
      <span class="pill pill-free">ว่าง</span>
      <span class="pill pill-occ">มีคนพัก</span>
      วันนี้: <span id="todayLabel"></span>
    </p>

    <div id="floors"></div>
  </div>
</div>

<script>
  let DATA = null;

  async function start() {
    const profile = await initLiff();
    if (!profile) return;
    DATA = await rpc('roomTimelines', { lineUserId: profile.userId });
    if (!DATA.ok) {
      document.querySelector('.wrap').innerHTML =
        '<div class="alert alert-error">หน้านี้สำหรับเจ้าหน้าที่ห้องพิเศษ/admin เท่านั้น</div>';
      return;
    }
    show($('loader'), false);
    show($('content'), true);
    render();
  }

  function render() {
    $('todayLabel').textContent = DATA.today || '';
    let all = 0, occ = 0;

    const floors = $('floors');
    floors.innerHTML = '';
    DATA.byFloor.forEach(f => {
      const fCard = document.createElement('div');
      fCard.className = 'card';
      const freeInFloor = f.rooms.filter(r => !r.occupiedToday).length;
      all += f.rooms.length;
      occ += f.rooms.filter(r => r.occupiedToday).length;
      const h = document.createElement('h2');
      h.innerHTML = 'ชั้น ' + f.floor + ' <span class="muted" style="font-size:13px;font-weight:400">(ว่าง '+freeInFloor+'/'+f.rooms.length+')</span>';
      fCard.appendChild(h);

      f.rooms.forEach(room => {
        const rDiv = document.createElement('div');
        rDiv.style.marginTop = '8px';
        const cur = room.current;
        const status = room.occupiedToday
          ? '<span class="pill pill-occ">มีคนพัก</span>'
          : '<span class="pill pill-free">ว่าง</span>';
        let detail = '';
        if (cur) {
          detail = `<div class="muted">${cur.patient_name} · ${cur.check_in_date} → ${cur.check_out_date}</div>`;
        }
        const upcoming = room.upcoming.length ? `<div class="muted">คิวถัดไป: ${room.upcoming.length} ราย</div>` : '';
        rDiv.innerHTML = `<div style="display:flex;justify-content:space-between;align-items:center">
            <b>ห้อง ${room.room_id}</b>${status}
          </div>${detail}${upcoming}`;
        fCard.appendChild(rDiv);
      });
      floors.appendChild(fCard);
    });

    $('totalAll').textContent = all;
    $('totalOcc').textContent = occ;
    $('totalFree').textContent = all - occ;
  }

  start();
</script>
</body>
</html>

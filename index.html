<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Room Reservation</title>
  <link rel="stylesheet" href="/styles.css">
  <script>
    // Default landing: redirect to /booking
    // (LIFF endpoint URL ตรงนี้ — Rich Menu ควรใช้ path เช่น /booking, /register โดยตรง)
    const params = new URLSearchParams(location.search);
    let page = params.get('page') || 'booking';
    const allowed = ['booking', 'register', 'my-bookings', 'dashboard'];
    if (!allowed.includes(page)) page = 'booking';
    const newSearch = location.search ? location.search : '';
    location.replace('/' + page + (newSearch ? newSearch : ''));
  </script>
</head>
<body>
  <div class="wrap"><div class="loader">กำลังเปลี่ยนหน้า...</div></div>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>จัดการคิว · ห้องพิเศษ</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/config.js"></script>
  <script src="/common.js"></script>
</head>
<body>
<div class="wrap">
  <h1>จัดการคิวห้องพิเศษ</h1>
  <p class="muted" id="whoText"></p>
  <div id="loader" class="loader">กำลังโหลด...</div>

  <div id="content" style="display:none">
    <div class="row" style="margin-bottom:14px;flex-wrap:wrap">
      <button class="btn-secondary" onclick="location.href='/dashboard'">🏥 ภาพรวมห้อง</button>
      <button class="btn-secondary" onclick="location.href='/stats'">📊 สถิติ</button>
      <button id="adminBtn" class="btn-secondary" style="display:none" onclick="location.href='/admin'">⚙️ จัดการสิทธิ์</button>
    </div>

    <h2>คนไข้รอจัดห้อง (<span id="waitCount">0</span>)</h2>
    <div id="queue"></div>

    <h2 style="margin-top:20px">ห้อง <span id="floorLabel"></span></h2>
    <div id="rooms"></div>
  </div>
</div>

<!-- Assign panel (overlay) -->
<div id="assignOverlay" class="overlay" style="display:none">
  <div class="sheet">
    <h2 id="assignTitle">จัดห้องให้คนไข้</h2>
    <p class="muted" id="assignPatient"></p>

    <label>ห้อง</label>
    <select id="assignRoom"></select>

    <label>วันเข้าพัก</label>
    <input id="assignDate" type="date">

    <label>จำนวนวัน</label>
    <input id="assignDays" type="number" min="1" value="1">

    <label class="chk" style="margin-top:8px"><input type="checkbox" id="assignOpen" onchange="toggleOpen()"> ยังไม่ระบุวันออก (ค้างห้องจนกว่า checkout)</label>

    <p class="muted" id="assignPreview"></p>
    <div id="assignMsg"></div>

    <div class="row" style="margin-top:12px">
      <button class="btn-secondary" onclick="closeAssign()">ยกเลิก</button>
      <button id="assignBtn" class="btn-primary" onclick="doAssign()">ยืนยันจัดห้อง</button>
    </div>
  </div>
</div>

<script>
  let ME = null;
  let DATA = null;       // roomTimelines
  let QUEUE = [];        // waiting requests
  let editingRequest = null;   // request being assigned/edited
  let editMode = false;        // true = editAssignment

  async function start() {
    const profile = await initLiff();
    if (!profile) return;
    ME = await rpc('getMe', { lineUserId: profile.userId });
    if (!ME.ward && !ME.admin) {
      document.querySelector('.wrap').innerHTML =
        '<div class="alert alert-error">หน้านี้สำหรับเจ้าหน้าที่ห้องพิเศษเท่านั้น</div>';
      return;
    }
    $('whoText').textContent = ME.admin
      ? 'ผู้ดูแลระบบ (เห็น/จัดได้ทุกชั้น)'
      : (ME.ward.name + ' · ดูแลชั้น ' + ME.ward.floor);
    if (ME.admin) show($('adminBtn'), true);
    await load();
  }

  async function load() {
    const [q, t] = await Promise.all([
      rpc('queueList', { lineUserId: LIFF_USER.userId }),
      rpc('roomTimelines', { lineUserId: LIFF_USER.userId })
    ]);
    QUEUE = q.requests || [];
    DATA = t;
    show($('loader'), false);
    show($('content'), true);
    $('floorLabel').textContent = (DATA.myFloor ? ('ชั้น ' + DATA.myFloor) : 'ทุกชั้น');
    renderQueue();
    renderRooms();
  }

  function tagsText(r) {
    const t = [];
    if (r.tag_relative) t.push('ญาติสายตรง');
    if (r.tag_staff) t.push('เจ้าหน้าที่');
    if (r.tag_vip) t.push('VIP');
    return t.join(', ');
  }

  function renderQueue() {
    $('waitCount').textContent = QUEUE.length;
    const wrap = $('queue');
    wrap.innerHTML = '';
    if (!QUEUE.length) {
      wrap.innerHTML = '<div class="card muted" style="text-align:center">ไม่มีคนไข้รอจัดห้อง</div>';
      return;
    }
    QUEUE.forEach(r => {
      const div = document.createElement('div');
      div.className = 'card';
      const tags = tagsText(r);
      div.innerHTML = `
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">${r.patient_name}</h2>
          <span class="pill pill-mine">รอจัดห้อง</span>
        </div>
        <div class="muted">${r.department} · ผู้ส่ง: ${r.staff_name}</div>
        <div style="margin-top:4px">Diagnosis: ${r.diagnosis || '-'}</div>
        ${r.note ? '<div class="muted">หมายเหตุ: '+r.note+'</div>' : ''}
        ${tags ? '<div class="muted">ป้าย: '+tags+'</div>' : ''}
      `;
      const btn = document.createElement('button');
      btn.className = 'btn-primary';
      btn.style.marginTop = '10px';
      btn.textContent = 'จัดห้อง';
      btn.onclick = () => openAssign(r, false);
      div.appendChild(btn);
      wrap.appendChild(div);
    });
  }

  function renderRooms() {
    const wrap = $('rooms');
    wrap.innerHTML = '';
    DATA.byFloor.forEach(f => {
      // ward staff: เห็นเฉพาะชั้นตัวเอง ; admin: ทุกชั้น
      if (!ME.admin && DATA.myFloor && f.floor !== DATA.myFloor) return;
      const head = document.createElement('div');
      head.className = 'floor-head';
      head.textContent = 'ชั้น ' + f.floor;
      wrap.appendChild(head);

      f.rooms.forEach(room => wrap.appendChild(roomCard_(f.floor, room)));
    });
  }

  function roomCard_(floor, room) {
    const div = document.createElement('div');
    div.className = 'card';
    const canManage = ME.admin || (DATA.myFloor === floor);

    const price = room.is_vip ? DATA.prices.vip : DATA.prices.normal;
    const priceLabel = `<div class="muted" style="margin-top:2px">${price.toLocaleString()} บาท/วัน</div>`;
    const typePill = room.is_vip ? '<span class="pill pill-vip">VIP</span>' : '';

    let inner = `<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">
        <div>
          <h2 style="margin:0">ห้อง ${room.room_id} ${typePill}</h2>
          ${priceLabel}
        </div>
        ${room.occupiedToday
            ? '<span class="pill pill-occ">มีคนพัก</span>'
            : '<span class="pill pill-free">ว่าง</span>'}
      </div>`;

    if (room.queue.length) {
      inner += '<div style="margin-top:8px">';
      room.queue.forEach(r => {
        const isCurrent = room.current && room.current.request_id === r.request_id;
        const outLabel = r.check_out_date ? thaiDate(r.check_out_date) : '<i>ไม่ระบุวันออก</i>';
        inner += `<div class="qrow ${isCurrent ? 'qcurrent' : ''}">
            <span class="qno">#${r.queue_no || '-'}</span>
            <span class="qbody"><b>${r.patient_name}</b><br>
              <span class="muted">${thaiDate(r.check_in_date)} → ${outLabel} · ${r.department}</span></span>
          </div>`;
      });
      inner += '</div>';
    } else {
      inner += '<div class="muted" style="margin-top:8px">ยังไม่มีคิว</div>';
    }
    div.innerHTML = inner;

    if (canManage) {
      room.queue.forEach(r => {
        const row = document.createElement('div');
        row.className = 'row';
        row.style.marginTop = '6px';
        const editBtn = document.createElement('button');
        editBtn.className = 'btn-secondary';
        editBtn.textContent = 'แก้ #' + (r.queue_no || '');
        editBtn.onclick = () => openAssign(r, true);
        row.appendChild(editBtn);

        if (!r.check_out_date) {
          // open-ended: ปุ่มกำหนดวันออก + ออกทันที (แทนปุ่มจำหน่ายธรรมดา)
          const setOutBtn = document.createElement('button');
          setOutBtn.className = 'btn-secondary';
          setOutBtn.textContent = 'กำหนดวันออก';
          setOutBtn.onclick = () => onSetCheckout(r);
          const nowBtn = document.createElement('button');
          nowBtn.className = 'btn-danger';
          nowBtn.textContent = 'ออกทันที';
          nowBtn.onclick = () => onCheckoutNow(r);
          row.appendChild(setOutBtn);
          row.appendChild(nowBtn);
        } else {
          const disBtn = document.createElement('button');
          disBtn.className = 'btn-danger';
          disBtn.textContent = 'จำหน่าย';
          disBtn.onclick = () => onDischarge(r);
          row.appendChild(disBtn);
        }
        div.appendChild(row);
      });
    }
    return div;
  }

  // ---------- Assign panel ----------

  function roomOptionsForAssign() {
    const opts = [];
    DATA.byFloor.forEach(f => {
      if (!ME.admin && DATA.myFloor && f.floor !== DATA.myFloor) return;
      f.rooms.forEach(room => opts.push({ room_id: room.room_id, floor: f.floor, is_vip: !!room.is_vip }));
    });
    return opts;
  }

  function openAssign(req, isEdit) {
    editingRequest = req;
    editMode = isEdit;
    $('assignTitle').textContent = isEdit ? 'แก้การจัดห้อง' : 'จัดห้องให้คนไข้';
    $('assignPatient').textContent = req.patient_name + ' · ' + req.department;
    $('assignMsg').innerHTML = '';

    const sel = $('assignRoom');
    sel.innerHTML = '';
    roomOptionsForAssign().forEach(o => {
      const opt = document.createElement('option');
      opt.value = o.room_id;
      const price = o.is_vip ? DATA.prices.vip : DATA.prices.normal;
      opt.textContent = 'ห้อง ' + o.room_id + ' (ชั้น ' + o.floor + ')'
        + (o.is_vip ? ' · VIP' : '')
        + ' — ' + price.toLocaleString() + ' บ./วัน';
      sel.appendChild(opt);
    });

    if (isEdit && req.room_id) sel.value = req.room_id;
    $('assignDate').value = isEdit && req.check_in_date ? req.check_in_date : (DATA.today || todayStr_());
    const isOpenExisting = isEdit && !req.check_out_date;
    $('assignOpen').checked = isOpenExisting;
    $('assignDays').disabled = isOpenExisting;
    $('assignDays').value = (isEdit && req.check_out_date) ? daysBetween_(req.check_in_date, req.check_out_date) : 1;
    updatePreview();
    show($('assignOverlay'), true);
  }

  function closeAssign() { show($('assignOverlay'), false); editingRequest = null; }

  function updatePreview() {
    const start = $('assignDate').value;
    const days = Number($('assignDays').value);
    const isOpen = $('assignOpen').checked;
    if (!start) { $('assignPreview').textContent = ''; return; }
    if (isOpen) {
      $('assignPreview').textContent = 'ช่วงพัก: ' + thaiDate(start) + ' → ไม่ระบุวันออก (ห้องล็อกจนกว่าจะกด checkout)';
    } else if (days >= 1) {
      const out = addDaysStr_(start, days);
      $('assignPreview').textContent = 'ช่วงพัก: ' + thaiDate(start) + ' → ' + thaiDate(out) + ' (ปล่อยห้อง ' + thaiDate(out) + ')';
    } else {
      $('assignPreview').textContent = '';
    }
  }

  function toggleOpen() {
    const isOpen = $('assignOpen').checked;
    $('assignDays').disabled = isOpen;
    updatePreview();
  }

  async function doAssign() {
    $('assignMsg').innerHTML = '';
    const isOpen = $('assignOpen').checked;
    const payload = {
      lineUserId: LIFF_USER.userId,
      requestId: editingRequest.request_id,
      roomId: $('assignRoom').value,
      startDate: $('assignDate').value,
      days: isOpen ? 0 : Number($('assignDays').value),
      open: isOpen
    };
    if (!payload.roomId || !payload.startDate) {
      $('assignMsg').appendChild(alertBox('กรุณากรอกห้อง และวันเข้าให้ครบ'));
      return;
    }
    if (!isOpen && !payload.days) {
      $('assignMsg').appendChild(alertBox('กรุณากรอกจำนวนวัน หรือติ๊ก "ยังไม่ระบุวันออก"'));
      return;
    }
    $('assignBtn').disabled = true;
    try {
      const res = await rpc(editMode ? 'editAssignment' : 'assignRoom', payload);
      if (res.ok) {
        closeAssign();
        await load();
      } else {
        $('assignMsg').appendChild(alertBox('ไม่สำเร็จ: ' + res.error));
      }
    } catch (e) {
      $('assignMsg').appendChild(alertBox('Error: ' + (e.message || e)));
    } finally {
      $('assignBtn').disabled = false;
    }
  }

  async function onDischarge(r) {
    if (!confirm('ยืนยันจำหน่ายคนไข้ ' + r.patient_name + ' ออกจากห้อง ' + r.room_id + ' ?')) return;
    const res = await rpc('discharge', { requestId: r.request_id, lineUserId: LIFF_USER.userId });
    if (res.ok) load();
    else alert('ผิดพลาด: ' + res.error);
  }

  async function onSetCheckout(r) {
    const def = todayStr_();
    const input = prompt('กำหนดวันออกของ ' + r.patient_name + '\n(yyyy-mm-dd) — ระบบจะ auto-discharge เมื่อถึงวัน', def);
    if (!input) return;
    if (!/^\d{4}-\d{2}-\d{2}$/.test(input)) {
      alert('รูปแบบวันที่ผิด ต้องเป็น yyyy-mm-dd');
      return;
    }
    const res = await rpc('setCheckout', { requestId: r.request_id, lineUserId: LIFF_USER.userId, checkOutDate: input });
    if (res.ok) load();
    else alert('ผิดพลาด: ' + res.error);
  }

  async function onCheckoutNow(r) {
    if (!confirm('Checkout ' + r.patient_name + ' ทันที (วันออก = วันนี้) ?')) return;
    const res = await rpc('checkoutNow', { requestId: r.request_id, lineUserId: LIFF_USER.userId });
    if (res.ok) load();
    else alert('ผิดพลาด: ' + res.error);
  }

  // ---------- date helpers ----------
  function todayStr_() {
    const d = new Date(); const z = n => String(n).padStart(2,'0');
    return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
  }
  function addDaysStr_(dateStr, days) {
    const p = dateStr.split('-').map(Number);
    const d = new Date(p[0], p[1]-1, p[2]); d.setDate(d.getDate()+days);
    const z = n => String(n).padStart(2,'0');
    return d.getFullYear() + '-' + z(d.getMonth()+1) + '-' + z(d.getDate());
  }
  function daysBetween_(a, b) {
    if (!a || !b) return 1;
    const pa = a.split('-').map(Number), pb = b.split('-').map(Number);
    const da = new Date(pa[0],pa[1]-1,pa[2]), db = new Date(pb[0],pb[1]-1,pb[2]);
    return Math.max(1, Math.round((db - da) / 86400000));
  }

  document.addEventListener('input', e => {
    if (e.target.id === 'assignDate' || e.target.id === 'assignDays') updatePreview();
  });

  start();
</script>
</body>
</html>

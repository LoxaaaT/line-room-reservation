<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ลงทะเบียน · Room Reservation</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/config.js"></script>
  <script src="/common.js"></script>
</head>
<body>
<div class="wrap">
  <h1>ลงทะเบียน</h1>
  <div id="loader" class="loader">กำลังโหลด...</div>

  <div id="form" style="display:none">
    <div class="card">
      <p class="muted" id="welcomeText"></p>

      <label>ชื่อ-นามสกุล (พร้อมคำนำหน้า)</label>
      <input id="name" placeholder="เช่น นพ.สมชาย ใจดี" autocomplete="off">

      <label>แผนก / ตึก</label>
      <select id="department">
        <option value="">— เลือกแผนก —</option>
      </select>

      <div id="msg"></div>

      <hr>
      <button id="submitBtn" class="btn-primary" onclick="submitForm()">ลงทะเบียน</button>
    </div>
  </div>
</div>

<script>
  async function start() {
    const profile = await initLiff();
    if (!profile) return;
    const me = await rpc('getMe', { lineUserId: profile.userId });

    const sel = $('department');
    (me.departments || []).forEach(d => {
      const opt = document.createElement('option');
      opt.value = d; opt.textContent = d;
      sel.appendChild(opt);
    });

    if (me.registered) {
      $('name').value = me.user.name || '';
      sel.value = me.user.department || '';
      $('welcomeText').textContent = 'คุณลงทะเบียนแล้ว — แก้ไขข้อมูลและกดบันทึกอีกครั้งได้';
    } else {
      $('welcomeText').textContent = 'สวัสดีคุณ ' + profile.displayName + ' กรุณากรอกข้อมูลเพื่อใช้งานระบบ';
    }
    show($('loader'), false);
    show($('form'), true);
  }

  async function submitForm() {
    const name = $('name').value.trim();
    const department = $('department').value;
    $('msg').innerHTML = '';
    if (!name || !department) {
      $('msg').appendChild(alertBox('กรุณากรอกชื่อและเลือกแผนกให้ครบ'));
      return;
    }
    $('submitBtn').disabled = true;
    try {
      const res = await rpc('register', {
        lineUserId: LIFF_USER.userId, name: name, department: department
      });
      if (res.ok) {
        $('msg').appendChild(alertBox('✓ ลงทะเบียนเรียบร้อย', true));
        setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 1200);
      } else {
        $('msg').appendChild(alertBox('ผิดพลาด: ' + res.error));
      }
    } catch (e) {
      $('msg').appendChild(alertBox('Error: ' + (e.message || e)));
    } finally {
      $('submitBtn').disabled = false;
    }
  }

  start();
</script>
</body>
</html>

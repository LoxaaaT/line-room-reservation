<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ลงทะเบียน · Room Reservation</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/config.js"></script>
  <script src="/common.js"></script>
</head>
<body>
<div class="wrap">
  <h1>ลงทะเบียน</h1>
  <div id="loader" class="loader">กำลังโหลด...</div>

  <div id="form" style="display:none">
    <div class="card">
      <p class="muted" id="welcomeText"></p>
      <label>รหัสพนักงาน (Staff ID)</label>
      <input id="staffId" placeholder="เช่น D00123, N00456" autocomplete="off">

      <label>ชื่อ-นามสกุล (พร้อมคำนำหน้า)</label>
      <input id="name" placeholder="เช่น นพ.สมชาย ใจดี" autocomplete="off">

      <label>ตำแหน่ง</label>
      <div class="seg">
        <button id="rDoctor" type="button" class="active" onclick="pickRole('doctor')">หมอ</button>
        <button id="rNurse" type="button" onclick="pickRole('nurse')">พยาบาล</button>
      </div>

      <div id="msg"></div>

      <hr>
      <button id="submitBtn" class="btn-primary" onclick="submitForm()">ลงทะเบียน</button>
    </div>
  </div>
</div>

<script>
  let role = 'doctor';
  function pickRole(r) {
    role = r;
    $('rDoctor').classList.toggle('active', r === 'doctor');
    $('rNurse').classList.toggle('active', r === 'nurse');
  }

  async function start() {
    const profile = await initLiff();
    if (!profile) return;
    const me = await rpc('getMe', { lineUserId: profile.userId });
    if (me.registered) {
      $('staffId').value = me.user.staff_id || '';
      $('name').value = me.user.name || '';
      pickRole(me.user.role || 'doctor');
      $('welcomeText').textContent = 'คุณลงทะเบียนแล้ว — แก้ไขข้อมูลและกดบันทึกอีกครั้งได้';
    } else {
      $('welcomeText').textContent = 'สวัสดีคุณ ' + profile.displayName + ' กรุณากรอกข้อมูลเพื่อใช้งานระบบ';
    }
    show($('loader'), false);
    show($('form'), true);
  }

  async function submitForm() {
    const staffId = $('staffId').value.trim();
    const name = $('name').value.trim();
    $('msg').innerHTML = '';
    if (!staffId || !name) {
      $('msg').appendChild(alertBox('กรุณากรอกรหัสและชื่อให้ครบ'));
      return;
    }
    $('submitBtn').disabled = true;
    try {
      const res = await rpc('register', {
        lineUserId: LIFF_USER.userId, staffId: staffId, name: name, role: role
      });
      if (res.ok) {
        $('msg').appendChild(alertBox('✓ ลงทะเบียนเรียบร้อย', true));
        setTimeout(() => { if (liff.isInClient()) liff.closeWindow(); }, 1200);
      } else {
        $('msg').appendChild(alertBox('ผิดพลาด: ' + res.error));
      }
    } catch (e) {
      $('msg').appendChild(alertBox('Error: ' + (e.message || e)));
    } finally {
      $('submitBtn').disabled = false;
    }
  }

  start();
</script>
</body>
</html>

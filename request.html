<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>ส่งคนไข้เข้าคิว · Room Reservation</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="/config.js"></script>
  <script src="/common.js"></script>
</head>
<body>
<div class="wrap">
  <h1>ส่งคนไข้เข้าคิว</h1>
  <div id="loader" class="loader">กำลังโหลด...</div>

  <div id="form" style="display:none">
    <div class="card">
      <p class="muted" id="whoText"></p>

      <label>ชื่อคนไข้</label>
      <input id="patientName" placeholder="ชื่อ-นามสกุล คนไข้" autocomplete="off">

      <label>Diagnosis</label>
      <textarea id="diagnosis" placeholder="การวินิจฉัย / อาการ"></textarea>

      <label>หมายเหตุ (ถ้ามี)</label>
      <textarea id="note" placeholder="ข้อมูลเพิ่มเติม"></textarea>

      <label>ป้ายกำกับ (เลือกได้หลายข้อ หรือไม่เลือกก็ได้)</label>
      <label class="chk"><input type="checkbox" id="tagRelative"> ญาติสายตรงเจ้าหน้าที่</label>
      <label class="chk"><input type="checkbox" id="tagStaff"> เจ้าหน้าที่</label>
      <label class="chk"><input type="checkbox" id="tagVip"> ผู้บริจาค VIP</label>

      <div id="msg"></div>

      <hr>
      <button id="submitBtn" class="btn-primary" onclick="submitForm()">ส่งเข้าคิว</button>
      <p class="muted" style="margin-top:8px">เจ้าหน้าที่ห้องพิเศษจะเป็นผู้จัดห้อง/คิวให้ แล้วระบบจะแจ้งกลับทาง LINE</p>
    </div>
  </div>

  <div id="success" class="card" style="display:none;text-align:center">
    <div style="font-size:52px;line-height:1.1">✅</div>
    <h2 style="margin:8px 0;color:#1d8a31">ส่งคนไข้เข้าคิวแล้ว</h2>
    <p id="successName" style="font-weight:700;font-size:18px;margin:4px 0"></p>
    <p class="muted" style="margin-bottom:4px">คนไข้อยู่ในคิวรอจัดห้องแล้ว</p>
    <p class="muted">เจ้าหน้าที่ห้องพิเศษจะจัดห้อง/คิวให้ แล้วระบบจะแจ้งกลับทาง LINE</p>
    <hr>
    <button class="btn-primary" onclick="goMyPatients()">ดูคนไข้ของฉัน</button>
    <button class="btn-secondary" style="margin-top:8px" onclick="submitAnother()">ส่งคนไข้อีกคน</button>
    <button id="closeBtn" class="btn-secondary" style="margin-top:8px;display:none" onclick="closeWin()">ปิดหน้านี้</button>
  </div>
</div>

<script>
  async function start() {
    const profile = await initLiff();
    if (!profile) return;
    const me = await rpc('getMe', { lineUserId: profile.userId });
    if (!me.registered) {
      document.querySelector('.wrap').innerHTML =
        '<div class="alert alert-error">กรุณาลงทะเบียนก่อนส่งคนไข้ — <a href="/register">ลงทะเบียนที่นี่</a></div>';
      return;
    }
    $('whoText').textContent = 'ผู้ส่ง: ' + me.user.name + ' · ' + me.user.department;
    show($('loader'), false);
    show($('form'), true);
  }

  async function submitForm() {
    $('msg').innerHTML = '';
    const payload = {
      lineUserId: LIFF_USER.userId,
      patientName: $('patientName').value.trim(),
      diagnosis: $('diagnosis').value.trim(),
      note: $('note').value.trim(),
      tagRelative: $('tagRelative').checked,
      tagStaff: $('tagStaff').checked,
      tagVip: $('tagVip').checked
    };
    if (!payload.patientName) {
      $('msg').appendChild(alertBox('กรุณากรอกชื่อคนไข้'));
      return;
    }
    $('submitBtn').disabled = true;
    try {
      const res = await rpc('submitRequest', payload);
      if (res.ok) {
        showSuccess(res.request);
      } else {
        $('msg').appendChild(alertBox('ไม่สำเร็จ: ' + res.error));
      }
    } catch (e) {
      $('msg').appendChild(alertBox('Error: ' + (e.message || e)));
    } finally {
      $('submitBtn').disabled = false;
    }
  }

  function showSuccess(req) {
    $('successName').textContent = req.patient_name;
    show($('form'), false);
    show($('success'), true);
    if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) {
      show($('closeBtn'), true);
    }
  }

  function goMyPatients() { location.href = '/my-patients'; }

  function submitAnother() {
    ['patientName', 'diagnosis', 'note'].forEach(id => { $(id).value = ''; });
    ['tagRelative', 'tagStaff', 'tagVip'].forEach(id => { $(id).checked = false; });
    $('msg').innerHTML = '';
    show($('success'), false);
    show($('form'), true);
  }

  function closeWin() {
    if (typeof liff !== 'undefined' && liff.isInClient && liff.isInClient()) liff.closeWindow();
  }

  start();
</script>
</body>
</html>
